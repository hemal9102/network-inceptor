[package]
name = "vodafone_ghost"
version = "0.1.0"
edition = "2021"

[dependencies]
wreq = { version = "6.0.0-rc.31", features = ["cookies", "json", "form"] }
tokio = { version = "1", features = ["full"] }
scraper = "0.17"
regex = "1"
serde_urlencoded = "0.7"
tracing = "0.1"
tracing-subscriber = "0.3"
rand = "0.8"
wreq-util = "3.0.0-rc.14"
tokio-tungstenite = "0.24"
futures-util = "0.3"
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }

